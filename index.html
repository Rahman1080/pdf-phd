<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Favicon - Multiple sizes for best compatibility like Google/YouTube/Microsoft -->
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="PDF PhD - The all-in-one PDF editor that works right in your browser. Edit, merge, split, convert, sign PDFs — all for free." />
  <meta name="keywords"
    content="PDF editor, PDF merger, PDF splitter, PDF tools, online PDF editor, free PDF editor, PDF PhD, convert to PDF" />
  <meta name="author" content="PDF PhD" />

  <!-- Open Graph / Social -->
  <meta property="og:title" content="PDF PhD - All-in-One PDF Editor" />
  <meta property="og:description"
    content="Edit, merge, split, convert, and sign PDFs directly in your browser. Privacy-first, no uploads required." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/logo.png" />

  <!-- Theme -->
  <meta name="theme-color" content="#e53935" />

  <title>PDF PhD - All-in-One PDF Editor</title>

  <style>
    /* Critical CSS for loading */
    body {
      margin: 0;
      padding: 0;
      background-color: #09090b;
      color: white;
      font-family: 'Inter', system-ui, sans-serif;
    }

    #root {
      min-height: 100vh;
    }

    /* Loading state */
    .initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #09090b;
    }

    .loader-icon {
      width: 64px;
      height: 64px;
      border: 4px solid #3f3f46;
      border-top-color: #e53935;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>

<body>
  <div id="root">
    <div class="initial-loader">
      <img src="/logo-phd.png" alt="PDF PhD"
        style="width: 160px; height: auto; margin-bottom: 20px; border-radius: 16px; filter: drop-shadow(0 0 20px rgba(229, 57, 53, 0.3));" />
      <div class="loader-icon"></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
